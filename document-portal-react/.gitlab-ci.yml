variables:
  DOCKER_IMAGE: ${ECR_REGISTRY}/devops/documind-ui
  CONTAINER_NAME: documind-portal

stages:
  - test
  - build
  - deploy

# Test stage
test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd document-portal-react
    - npm ci
  script:
    - npm run lint || echo "Lint warnings ignored"
  only:
    - merge_requests
    - develop
    - main

# Build Docker image and push to ECR
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    # Install AWS CLI
    - apk add --no-cache python3 py3-pip
    - pip3 install awscli
    # Login to ECR
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - cd document-portal-react
    - docker build -t ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA} ${DOCKER_IMAGE}:latest
    - docker push ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${DOCKER_IMAGE}:latest
    - echo "Built and pushed ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  only:
    - develop
    - main

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan ${DEPLOY_HOST} >> ~/.ssh/known_hosts
  script:
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
        # Login to ECR on deployment server
        aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
        
        # Pull and deploy
        docker pull ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
        docker stop ${CONTAINER_NAME} || true
        docker rm ${CONTAINER_NAME} || true
        docker run -d \
          --name ${CONTAINER_NAME} \
          --restart unless-stopped \
          -p 8080:80 \
          ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
        docker system prune -af --volumes || true
      ENDSSH
  environment:
    name: production
    url: http://${DEPLOY_HOST}:8080
  when: manual
  only:
    - main
